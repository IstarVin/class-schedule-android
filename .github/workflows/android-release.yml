name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag, e.g. v1.0.0 (leave empty for build only)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag_name && format('refs/tags/{0}', inputs.tag_name) || github.ref }}
          persist-credentials: false

      - name: Validate manual release tag
        if: inputs.tag_name != ''
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo '::error::Release tags must begin with v.'
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          # Matches gradle/gradle-daemon-jvm.properties.
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing required repository secret: $secret"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Test, lint, and build release APK and app bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Avoid persisting signing credentials in the configuration cache.
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          testDebugUnitTest lintDebug lintRelease assembleRelease bundleRelease

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Prepare release files
        run: |
          version=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo '::error::App version cannot be used in a release filename.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-package"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release-package/ClassSchedule-${version}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/release-package/ClassSchedule-${version}.aab"
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/release-package/mapping.txt"
          cd "$RUNNER_TEMP/release-package"
          sha256sum ClassSchedule-*.apk ClassSchedule-*.aab mapping.txt > SHA256SUMS

      - name: Upload release artifacts
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-release-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-package/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/release-package"
          sha256sum --check SHA256SUMS
          files=("$RUNNER_TEMP"/release-package/*)
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
          fi
